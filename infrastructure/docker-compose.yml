version: '3.8'

services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:16-alpine
    container_name: sebacox_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-sebacox_db}
      POSTGRES_USER: ${DB_USER:-sebacox_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sebacox_secure_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sebacox_user} -d ${DB_NAME:-sebacox_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: sebacox_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Django REST API Backend
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: sebacox_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ../backend:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      DATABASE_URL: postgresql://${DB_USER:-sebacox_user}:${DB_PASSWORD:-sebacox_secure_pass}@postgres:5432/${DB_NAME:-sebacox_db}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery Asynchronous Task Worker
  celery_worker:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: sebacox_celery_worker
    command: celery -A workers.celery worker --loglevel=info
    volumes:
      - ../backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DATABASE_URL: postgresql://${DB_USER:-sebacox_user}:${DB_PASSWORD:-sebacox_secure_pass}@postgres:5432/${DB_NAME:-sebacox_db}
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - redis
      - postgres

volumes:
  postgres_data:
  redis_data:
